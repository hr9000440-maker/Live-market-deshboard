name: CoinSwitch Options Strong Signals
on:
  # Manual-only while the legacy Binance-spot pseudo-options script is replaced
  # with a verified option-chain premium feed.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: options-strong-signals
  cancel-in-progress: true
jobs:
  signals:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Refuse unverified option alerts
        run: |
          python3 - <<'PY'
          import sys
          print("BLOCKED: no verified CoinSwitch option-chain premium feed is configured.")
          print("No Telegram signal was sent. Spot price is not option premium.")
          sys.exit(2)
          PY
