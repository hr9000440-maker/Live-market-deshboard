name: Seven Coin 15m Confirmed CALL PUT Direction Signals
on:
  push:
    branches: [main]
    paths:
      - 'options_strong_signals.py'
      - '.github/workflows/options-strong-signals.yml'
  schedule:
    # Scan every five minutes so fresh 1m impulses are checked promptly (UTC).
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: options-strong-signals
  cancel-in-progress: false
jobs:
  signals:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Send BTC ETH BNB ZEC DOGE option alerts
        env:
          # Reuse the exact same bot token as the Crypto Futures Telegram workflow.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAMBOTTOKAN: ${{ secrets.TELEGRAMBOTTOKAN }}
          TELEGRAM_BOT_TOKAN: ${{ secrets.TELEGRAM_BOT_TOKAN }}
          TELEGRAM_BOT_FATHER: ${{ secrets.TELEGRAM_BOT_FATHER }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 options_strong_signals.py
      - name: Save duplicate-prevention state
        if: always()
        run: |
          if [[ -n "$(git status --porcelain state/option_telegram_signals.json state/option_positions.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/option_telegram_signals.json state/option_positions.json
            git commit -m "Save strong option Telegram alert state"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push; then
                exit 0
              fi
              sleep $((attempt * 2))
            done
            echo "Could not publish state after 5 retries"
            exit 1
          fi
