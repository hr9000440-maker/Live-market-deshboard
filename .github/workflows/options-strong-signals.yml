name: Seven Coin 15m Confirmed CALL PUT Direction Signals
on:
  schedule:
    # Run shortly after each 15-minute candle closes (UTC).
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: options-strong-signals
  cancel-in-progress: true
jobs:
  signals:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Send seven-coin confirmed direction signals
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAMBOTTOKAN: ${{ secrets.TELEGRAMBOTTOKAN }}
          TELEGRAM_BOT_TOKAN: ${{ secrets.TELEGRAM_BOT_TOKAN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 options_strong_signals.py
