name: Crypto Telegram Signals

# Futures alerts paused for now. Keep manual dispatch available for later testing.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crypto-telegram-signals
  cancel-in-progress: false

jobs:
  send-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout dashboard
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch closed candles and send Telegram alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/crypto-telegram.js
      - name: Save duplicate-prevention state
        run: |
          if [[ -n "$(git status --porcelain state/signals.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/signals.json
            git commit -m "Update crypto Telegram signal state"
            git push
          fi
