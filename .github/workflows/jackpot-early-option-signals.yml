name: BTC ETH BNB ZEC Zero Hero Early 5m Alerts
on:
  push:
    branches:
      - main
    paths:
      - jackpot_early_option_signals.py
      - options_strong_signals.py
      - .github/workflows/jackpot-early-option-signals.yml
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: zero-hero-jackpot-early-alerts
  cancel-in-progress: false
jobs:
  early-jackpot:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Send BTC ETH BNB ZEC early Jackpot alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAMBOTTOKAN: ${{ secrets.TELEGRAMBOTTOKAN }}
          TELEGRAM_BOT_TOKAN: ${{ secrets.TELEGRAM_BOT_TOKAN }}
          TELEGRAM_BOT_FATHER: ${{ secrets.TELEGRAM_BOT_FATHER }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 jackpot_early_option_signals.py
      - name: Save Zero Hero duplicate state
        if: always()
        run: |
          if [[ -n "$(git status --porcelain state/jackpot_early_signals.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/jackpot_early_signals.json
            git commit -m "Save BTC ETH early Jackpot signal state"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push; then
                exit 0
              fi
              sleep $((attempt * 2))
            done
            echo "Could not publish state after 5 retries"
            exit 1
          fi
