name: Dashboard Health Monitor
on:
  push:
    paths:
      - 'scripts/dashboard-health-check.py'
      - 'health-monitor.html'
      - 'index.html'
      - 'options_strong_signals.py'
      - 'state/option_positions.json'
      - '.github/workflows/dashboard-health-monitor.yml'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: dashboard-health-monitor
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check dashboard services and alert on failure
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAMBOTTOKAN: ${{ secrets.TELEGRAMBOTTOKAN }}
          TELEGRAM_BOT_TOKAN: ${{ secrets.TELEGRAM_BOT_TOKAN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/dashboard-health-check.py
