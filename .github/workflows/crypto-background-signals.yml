name: Crypto Telegram Background Signals
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
        uses: actions/cache/restore@v4
        with:
          path: signal_state.json
          key: crypto-signal-state-${{ github.run_id }}
          restore-keys: crypto-signal-state-
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/hr9000440-maker/Live-market-deshboard/main/background_crypto_signals.py -o background_crypto_signals.py
          python3 background_crypto_signals.py
        uses: actions/cache/save@v4
        if: always()
        with:
          path: signal_state.json
          key: crypto-signal-state-${{ github.run_id }}
