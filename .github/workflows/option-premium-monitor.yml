name: Server Option Premium TP SL Monitor
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "track_option_positions.py"
      - ".github/workflows/option-premium-monitor.yml"
permissions:
  contents: write
concurrency:
  group: option-premium-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check active option premiums and milestones
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAMBOTTOKAN: ${{ secrets.TELEGRAMBOTTOKAN }}
          TELEGRAM_BOT_TOKAN: ${{ secrets.TELEGRAM_BOT_TOKAN }}
          TELEGRAM_BOT_FATHER: ${{ secrets.TELEGRAM_BOT_FATHER }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 track_option_positions.py
      - name: Save monitoring state
        if: always()
        run: |
          if [[ -n "$(git status --porcelain state/option_positions.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/option_positions.json
            git commit -m "Update option premium TP SL tracking state"
            git push
          fi
