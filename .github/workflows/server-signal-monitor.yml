name: Server Crypto Signal Monitor

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
        with:
          path: .signal-state
          key: signal-state-${{ github.run_id }}
          restore-keys: |
            signal-state-
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p .signal-state
          python monitor.py
        if: always()
        with:
          path: .signal-state
          key: signal-state-${{ github.run_id }}
