name: Independent Gamma Blast Early Detector
on:
  push:
    branches: [main]
    paths:
      - 'gamma_blast_early_detector.py'
      - '.github/workflows/gamma-blast-early-detector.yml'
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gamma-blast-early-detector
  cancel-in-progress: false
jobs:
  gamma-blast:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Run independent Gamma Blast detector
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAMBOTTOKAN: ${{ secrets.TELEGRAMBOTTOKAN }}
          TELEGRAM_BOT_TOKAN: ${{ secrets.TELEGRAM_BOT_TOKAN }}
          TELEGRAM_BOT_FATHER: ${{ secrets.TELEGRAM_BOT_FATHER }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 gamma_blast_early_detector.py
      - name: Save independent Gamma Blast baseline and duplicate state
        if: always()
        run: |
          if [[ -n "$(git status --porcelain state/gamma_blast_state.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/gamma_blast_state.json
            git commit -m "Save Gamma Blast option quote baseline"
            git push
          fi
